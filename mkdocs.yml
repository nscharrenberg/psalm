site_name: psalm
repo_url: https://github.com/nscharrenberg/psalm
site_url: https://nscharrenberg.github.io/psalm
site_description: Probing Stylistic Appropriation in Large Language Models (PSALM): An LLM-as-a-Judge Framework for Evaluating Copyright Infringement under EU Law.
site_author: Noah Scharrenberg
edit_uri: edit/main/docs/
repo_name: nscharrenberg/psalm
copyright: Maintained by <a href="https://nscharrenberg.com">nscharrenberg</a>.

nav:
  - Home: index.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src/psalm"]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nscharrenberg/psalm
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/psalm

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
